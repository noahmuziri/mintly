<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta property="og:title" content="Cryptocurrencies — Mintly">
<meta name="theme-color" content="#1B5E40">
<meta property="og:site_name" content="Mintly">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<title>Cryptocurrencies — Mintly</title>
<link rel="icon" type="image/svg+xml" href="../assets/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<script src="../theme.js"></script>
</head>
<body>

<header id="site-header" class="site-header"></header>

<main>
  <div class="wrap empty-state">
    <div class="icon-big"><span class="art" data-art="shield" style="width:64px;display:block;margin:0 auto"></span></div>
    <h2>Cryptocurrencies is locked</h2>
    <p>This course unlocks after Financial Literacy and Collectables. Start with Financial Literacy first.</p>
    <p id="lock-progress"></p>
    <a class="btn" href="financial-literacy.html" id="lock-cta">Go to Financial Literacy</a>
  </div>
</main>

<footer id="site-footer" class="site-footer"></footer>

<script src="../script.js"></script>
<script src="../art.js"></script>
<script>
  Mintly.requireSubscription();
  const done = Mintly.completedCount();
  const total = Mintly.LESSON_IDS.length;
  if (done < total) {
    const next = Mintly.nextLesson();
    document.getElementById('lock-progress').textContent =
      "You've completed " + done + " of " + total + " Financial Literacy lessons so far.";
    const cta = document.getElementById('lock-cta');
    cta.href = next.id + '.html';
    cta.textContent = 'Continue with lesson ' + (Mintly.LESSON_IDS.indexOf(next.id) + 1) + ': ' + next.title;
  } else {
    document.getElementById('lock-progress').textContent =
      "You've finished Financial Literacy. Cryptocurrencies opens once the Collectables lessons are out.";
  }
</script>
</body>
</html>
