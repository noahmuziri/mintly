<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta property="og:title" content="Collectables — Mintly">
<meta name="theme-color" content="#1B5E40">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192.png">
<meta property="og:image" content="/assets/og.png">
<meta name="twitter:image" content="/assets/og.png">
<meta property="og:site_name" content="Mintly">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<title>Collectables — Mintly</title>
<link rel="icon" type="image/svg+xml" href="../assets/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<script src="../theme.js"></script>
</head>
<body>

<header id="site-header" class="site-header"></header>

<main>
  <div class="wrap empty-state">
    <div class="icon-big"><span class="art" data-art="shield" style="width:64px;display:block;margin:0 auto"></span></div>
    <h2>Collectables is locked</h2>
    <p id="lock-message">Finish every Financial Literacy lesson to unlock this course.</p>
    <a class="btn" href="financial-literacy.html" id="lock-cta">Go to Financial Literacy</a>
  </div>
</main>

<footer id="site-footer" class="site-footer"></footer>

<script src="../script.js"></script>
<script src="../art.js"></script>
<script>
  Mintly.requireSubscription();
  if (Mintly.isCourseComplete()) {
    document.getElementById('lock-message').textContent = "You've unlocked Collectables — lessons are still being written. Check back soon.";
    document.getElementById('lock-cta').style.display = 'none';
    document.querySelector('.icon-big').innerHTML = '<span class="art" data-art="trophy" style="width:64px;display:block;margin:0 auto"></span>'; if (window.MintlyArt) MintlyArt.mount();
    document.querySelector('h2').textContent = 'Collectables — coming very soon';
  } else {
    const next = Mintly.nextLesson();
    const nextNum = Mintly.LESSON_IDS.indexOf(next.id) + 1;
    document.getElementById('lock-message').textContent =
      "You've completed " + Mintly.completedCount() + " of " + Mintly.LESSON_IDS.length +
      " Financial Literacy lessons. Finish them all to unlock this course.";
    const cta = document.getElementById('lock-cta');
    cta.href = next.id + '.html';
    cta.textContent = 'Continue with lesson ' + nextNum + ': ' + next.title;
  }
</script>
</body>
</html>
