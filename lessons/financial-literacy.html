<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta property="og:title" content="Financial Literacy — Mintly">
<meta name="theme-color" content="#1B5E40">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192.png">
<meta property="og:image" content="/assets/og.png">
<meta name="twitter:image" content="/assets/og.png">
<meta property="og:site_name" content="Mintly">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<title>Financial Literacy — Mintly</title>
<link rel="icon" type="image/svg+xml" href="../assets/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<script src="../theme.js"></script>
</head>
<body>

<header id="site-header" class="site-header"></header>

<main>
  <div class="wrap page-header">
    <div class="eyebrow">Course</div>
    <h1>Financial Literacy</h1>
    <p>Fifteen lessons in three units: the foundations every teen should know, the real-world money you'll meet first, then the bigger decisions ahead. Each lesson has a short video, hands-on practice and a quiz. Best taken in order.</p>
    <div class="course-progress">
      <div class="progress-track" role="progressbar" aria-label="Course progress" aria-valuemin="0" aria-valuemax="15" aria-valuenow="0" id="course-bar"><div class="progress-fill" id="course-fill" style="width:0%"></div></div>
      <div class="label" id="course-label">0 of 15 lessons complete</div>
    </div>
    <a class="btn" href="lesson-1.html" id="continue-btn">Start lesson 1 →</a>
  </div>

  <div class="wrap lesson-list" id="lesson-list"></div>
</main>

<footer id="site-footer" class="site-footer"></footer>

<script src="../script.js"></script>
<script src="../art.js"></script>
<script>
  const UNITS = [[1, "Unit 1 · Foundations", "Budgeting, saving, banking and your first look at investing."], [2, "Unit 2 · Real-world money", "Borrowing, compound interest, paychecks, scams and your own plan."], [3, "Unit 3 · Going further", "Inflation, side hustles, insurance, spotting hype and paying for college."]];
  const list = document.getElementById("lesson-list");
  const total = Mintly.LESSON_IDS.length;
  const done = Mintly.completedCount();
  const next = Mintly.nextLesson();
  list.innerHTML = UNITS.map(([u, title, sub]) => {
    const rows = Mintly.LESSONS.map((l, i) => ({ l, i })).filter(({ l }) => (l.unit || 1) === u).map(({ l, i }) => {
      const d = Mintly.isLessonComplete(l.id);
      const lockedRow = !Mintly.canAccess(l.id);
      const label = lockedRow ? "🔒 Members" : d ? "✓ Complete — review" : (done > 0 && done < total && l.id === next.id) ? "Up next →" : l.id === "lesson-1" && !Mintly.hasActivePlan() ? "Free →" : "Start →";
      return `<a class="lesson-row${d ? " done" : ""}${lockedRow ? " locked-row" : ""}" href="${l.id}.html" id="row-${l.id}"><span class="num">${i + 1}</span><span class="title">${l.title}</span><span class="time">${l.mins} min · ▶ video</span><span class="go">${label}</span></a>`;
    }).join("");
    return `<div class="explore-label" style="margin:${u === 1 ? 0 : 28}px 0 4px">${title}</div><p class="muted" style="margin:0 0 8px;font-size:14px">${sub}</p>${rows}`;
  }).join("") + `<div class="next-course"><div class="icon">🔒</div><div><div class="title">Collectables</div><div class="desc">Unlocks after you complete every lesson above</div></div><div class="progress" id="course-progress">${done} of ${total} complete</div></div>`;
  if (!Mintly.hasActivePlan()) list.insertAdjacentHTML("afterbegin", '<div class="unlock-banner"><div><b>Lesson 1 is free.</b> Unlock all fifteen lessons, their films, Leaf and the dashboards.</div><a class="btn" href="../pricing.html">See plans</a></div>');
  const nextNum = Mintly.LESSON_IDS.indexOf(next.id) + 1;
  const cont = document.getElementById("continue-btn");
  cont.href = next.id + ".html";
  cont.textContent = done === 0 ? "Start lesson 1 →" : done === total ? "Review from lesson 1 →" : "Continue: lesson " + nextNum + " →";
  document.getElementById("course-fill").style.width = Math.round(done / total * 100) + "%";
  document.getElementById("course-bar").setAttribute("aria-valuenow", done);
  document.getElementById("course-bar").setAttribute("aria-valuemax", total);
  document.getElementById("course-label").textContent = done + " of " + total + " lessons complete" + (done === total ? " · Collectables and Cryptocurrencies are unlocked" : "");
</script>
</body>
</html>
