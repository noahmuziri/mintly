<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirm email — Mintly</title>
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&family=Fraunces:wght@600;700;800&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="theme.js"></script>
</head>
<body>

<header class="site-header">
  <div class="wrap navbar">
    <a class="brand" href="index.html">mintly<span class="dot">.</span></a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="lessons/lesson-1.html">Learn</a></li>
      <li><a href="lessons/explore.html">Explore</a></li>
      <li><a href="index.html#simulate">Simulate</a></li>
      <li><a href="pricing.html">Pricing</a></li>
      <li><a href="parents.html">For Parents</a></li>
      <li><a href="teachers.html">For Teachers</a></li>
      <li><a href="mintly.demo.html?from=site">Demo</a></li>
    </ul>
    <div class="nav-right">
      <div class="nav-auth" id="nav-auth"></div>
    </div>
  </div>
</header>

<main>
  <div class="auth-wrap">
    <div class="auth-card">
      <h1 id="v-title">Confirming your email…</h1>
      <p class="sub" id="v-sub"></p>
      <a class="btn" id="v-btn" href="dashboard.html" style="display:none;text-align:center">Go to my dashboard</a>
    </div>
  </div>
</main>
<footer class="site-footer">
  <div class="wrap">Mintly · Financial learning for the next generation · <a href="privacy.html">Privacy</a> · <a href="terms.html">Terms</a></div>
</footer>

<script src="script.js"></script>
<script src="dashboard.js"></script>
<script>
Mintly.ready.then(async () => {
  const token = new URLSearchParams(location.search).get("token");
  const r = token ? await Mintly.api("POST", "/api/auth/verify", { token }) : { ok: false, error: "This link is missing its code." };
  $("v-title").textContent = r.ok ? "Email confirmed" : "That link didn't work";
  $("v-sub").textContent = r.ok ? "Thanks. Your email address is confirmed." : r.error + " You can ask for a new one from your account page.";
  $("v-btn").style.display = "block";
  if (!r.ok) $("v-btn").textContent = "Go to my account";
  $("v-btn").href = r.ok ? "dashboard.html" : "account.html";
});
</script>
</body>
</html>
