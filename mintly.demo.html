<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta property="og:title" content="Mintly in about a minute">
<meta property="og:description" content="Press start and Mintly walks itself through lessons, Leaf, the Decision Score and the student, parent and teacher dashboards.">
<meta name="theme-color" content="#1B5E40">
<meta property="og:site_name" content="Mintly">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<title>Mintly in about a minute</title>
<meta name="description" content="Press start and Mintly walks itself through lessons, Leaf, the Decision Score and the student, parent and teacher dashboards.">
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="demo.css">
<script src="theme.js"></script>
</head>
<body class="film">
<div id="film" class="film-root" data-state="idle">
  <div class="stage" id="stage" aria-live="off"></div>
  <div class="wipe" id="wipe" aria-hidden="true"></div>
  <div class="cursor" id="cursor" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 2 4 7-3 1.500-4-7-5 4Z" fill="#fff" stroke="#10241B" stroke-width="1.600" stroke-linejoin="round"/></svg><i></i></div>

  <div class="intro" id="intro">
    <img src="assets/logo.svg" alt="" width="84" height="84">
    <h1>Mintly in about a minute.</h1>
    <p>One press. The demo plays itself: lessons, Leaf, the Decision Score and all three dashboards.</p>
    <button class="btn btn-lg" id="start" type="button"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M7 4.500v15a1 1 0 0 0 1.500.86l12.400-7.500a1 1 0 0 0 0-1.720L8.500 3.640A1 1 0 0 0 7 4.500Z"/></svg>Start</button>
    <a class="back" href="index.html">Back to site</a>
  </div>

  <div class="bar" id="bar" role="toolbar" aria-label="Demo controls">
    <button type="button" id="b-prev" aria-label="Previous scene"><svg viewBox="0 0 24 24"><path d="M6 5v14M19 5L9 12l10 7Z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button>
    <button type="button" id="b-play" aria-label="Pause"><svg viewBox="0 0 24 24" class="i-pause"><path d="M8 5v14M16 5v14" stroke="currentColor" stroke-width="3.500" stroke-linecap="round"/></svg><svg viewBox="0 0 24 24" class="i-play"><path d="M8 4.500v15l12-7.500Z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button>
    <button type="button" id="b-next" aria-label="Next scene"><svg viewBox="0 0 24 24"><path d="M18 5v14M5 5l10 7-10 7Z" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button>
    <div class="segs" id="segs"></div>
    <span class="label" id="label"></span>
    <button type="button" id="b-replay" aria-label="Replay"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 3-6.200"/><path d="M4 4v5h5"/></svg></button>
    <a class="exit" href="index.html">Exit</a>
  </div>
</div>
<script src="art.js"></script>
<script src="demo.js"></script>
</body>
</html>
